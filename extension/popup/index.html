<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GestureSync AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 280px;
      background: #0e0e13;
      color: #e4e1e9;
      font-family: Inter, -apple-system, sans-serif;
      font-size: 13px;
    }
    .header {
      background: linear-gradient(135deg, #0566d9, #06b6d4);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo { font-size: 18px; }
    .title { font-weight: 700; font-size: 14px; letter-spacing: -0.01em; }
    .subtitle { font-size: 11px; opacity: 0.8; margin-top: 1px; }
    .status-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px 16px;
      background: #1b1b20;
      border-bottom: 1px solid #3d494c40;
      font-size: 11px;
      color: #bcc9cd;
    }
    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #4cd7f6;
      box-shadow: 0 0 6px #4cd7f6;
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%,100%{ opacity:1 } 50%{ opacity:0.4 } }
    .section {
      padding: 14px 16px;
      border-bottom: 1px solid #3d494c30;
    }
    .label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #869397;
      margin-bottom: 8px;
      font-weight: 600;
    }
    .btn {
      width: 100%;
      padding: 9px 12px;
      border-radius: 8px;
      border: 1px solid #3d494c60;
      background: #1f1f25;
      color: #e4e1e9;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.15s;
    }
    .btn:hover { background: #2a292f; border-color: #4cd7f660; color: #4cd7f6; }
    .btn.primary {
      background: linear-gradient(135deg, #0566d9, #06b6d4);
      border-color: transparent;
      color: #001f26;
      box-shadow: 0 0 16px rgba(76,215,246,0.3);
    }
    .btn.primary:hover { box-shadow: 0 0 24px rgba(76,215,246,0.5); transform: scale(1.01); }
    .btn + .btn { margin-top: 6px; }
    .open-link {
      display: block;
      text-align: center;
      padding: 10px;
      font-size: 11px;
      color: #4cd7f6;
      text-decoration: none;
    }
    .open-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">⬥</div>
    <div>
      <div class="title">GestureSync AI</div>
      <div class="subtitle">Real-Time ASL Translation</div>
    </div>
  </div>

  <div class="status-bar">
    <div class="dot"></div>
    <span>Engine Online · 42ms latency</span>
  </div>

  <div class="section">
    <div class="label">Google Meet</div>
    <button class="btn primary" id="toggleOverlay">
      ⬥ Toggle ASL Overlay
    </button>
    <button class="btn" id="startCapture">
      🎙 Start Live Capture
    </button>
    <button class="btn" id="stopCapture">
      ⏹ Stop Capture
    </button>
  </div>

  <div class="section">
    <div class="label">Quick Links</div>
    <button class="btn" id="openDashboard">
      📊 Open Dashboard
    </button>
  </div>

  <a class="open-link" href="http://localhost:3000" target="_blank">
    Open GestureSync App ↗
  </a>

  <script>
    document.getElementById('toggleOverlay').addEventListener('click', async () => {
      const [tab] = await chrome.tabs.query({ active: true, currentWindow: true });
      chrome.tabs.sendMessage(tab.id, { type: 'TOGGLE_OVERLAY' });
    });

    document.getElementById('startCapture').addEventListener('click', async () => {
      const [tab] = await chrome.tabs.query({ active: true, currentWindow: true });
      chrome.runtime.sendMessage({ type: 'START_CAPTURE', tabId: tab.id }, (res) => {
        console.log('Capture started:', res);
      });
    });

    document.getElementById('stopCapture').addEventListener('click', () => {
      chrome.runtime.sendMessage({ type: 'STOP_CAPTURE' });
    });

    document.getElementById('openDashboard').addEventListener('click', () => {
      chrome.tabs.create({ url: 'http://localhost:3000/dashboard' });
    });
  </script>
</body>
</html>
